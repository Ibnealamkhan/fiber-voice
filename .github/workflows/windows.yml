name: Windows app
on:
  workflow_dispatch:
  push:
    paths: ['winapp/**', 'gateway/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['winapp/**', 'gateway/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build app and installer
        shell: pwsh
        run: ./winapp/build.ps1
      - name: Check bundled calling engine on Windows
        shell: pwsh
        run: |
          $env:GATEWAY_LIB_DIR = "$pwd/winapp/build/payload/codecs"
          ./winapp/build/payload/python/python.exe ./winapp/smoke_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Native codec smoke test failed' }
          ./winapp/build/payload/python/python.exe -m unittest discover -s gateway/tests -p test_desktop.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Gateway lifecycle test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: FiberVoice-Windows-x64
          path: |
            winapp/dist/FiberVoice.exe
            winapp/dist/FiberVoice-Setup.exe
